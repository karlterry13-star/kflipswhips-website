[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'No build step needed — static site + functions.'"
SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"
# Friendly URL for the public form to call
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Prevent 404s on refresh/deep-link inside the admin app (it is a single-page app
# that handles its own routing via URL hash, e.g. /admin/#/leads/<id>)
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
